<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SAYKØ FITNESS</title>

<link rel="icon" type="image/jpeg" href="1790471069347.jpg">
<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#080808">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<style>

/* =========================================================
   SAYKØ FITNESS — NEW CSS ONLY
   ========================================================= */

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,Tahoma,sans-serif;
-webkit-tap-highlight-color:transparent;
}

:root{
--bg:#060606;
--card:#101010;
--card2:#151515;
--border:#292929;
--border2:#353535;
--red:#e50914;
--red-dark:#a8060d;
--red-light:#ff2631;
--white:#fff;
--gray:#888;
--gray2:#555;
}

/* ================= BODY ================= */

html{
scroll-behavior:smooth;
}

body{
background:
radial-gradient(
circle at 50% -15%,
rgba(229,9,20,.16),
transparent 35%
),
radial-gradient(
circle at 100% 50%,
rgba(229,9,20,.035),
transparent 30%
),
var(--bg);

color:var(--white);
min-height:100vh;
padding-bottom:45px;
overflow-x:hidden;
}

/* ================= HEADER ================= */

header{
position:sticky;
top:0;
z-index:20;

padding:18px 14px 16px;

text-align:center;

background:rgba(6,6,6,.92);

backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);

border-bottom:1px solid rgba(255,255,255,.07);

box-shadow:
0 8px 35px rgba(0,0,0,.4);
}

.logo{
font-size:30px;
font-weight:900;
letter-spacing:2.5px;

text-shadow:
0 0 20px rgba(255,255,255,.06);
}

.logo span{
color:var(--red);

text-shadow:
0 0 18px rgba(229,9,20,.35);
}

.subtitle{
color:#777;
font-size:11px;
margin-top:7px;
letter-spacing:1px;
}

#installButton{
display:none;

margin:13px auto 0;

background:
linear-gradient(
135deg,
var(--red-light),
var(--red-dark)
);

color:#fff;

border:1px solid rgba(255,255,255,.08);

border-radius:11px;

padding:10px 18px;

font-weight:bold;
font-size:12px;

cursor:pointer;

box-shadow:
0 8px 22px rgba(229,9,20,.2);

transition:.2s;
}

#installButton:active{
transform:scale(.95);
}

/* ================= CONTAINER ================= */

.container{
width:100%;
max-width:920px;
margin:auto;
padding:18px 15px 0;
}

/* ================= SEARCH ================= */

.search{
width:100%;
height:50px;

padding:0 17px;

background:
linear-gradient(
145deg,
#151515,
#0d0d0d
);

border:1px solid var(--border);

border-radius:15px;

color:white;

outline:none;

margin-bottom:18px;

font-size:14px;

box-shadow:
inset 0 1px 0 rgba(255,255,255,.025),
0 8px 25px rgba(0,0,0,.2);

transition:.2s;
}

.search::placeholder{
color:#666;
}

.search:focus{
border-color:rgba(229,9,20,.75);

box-shadow:
0 0 0 3px rgba(229,9,20,.08),
0 8px 25px rgba(0,0,0,.25);
}

/* ================= GOAL ================= */

.goal{
position:relative;

background:
linear-gradient(
145deg,
#151515,
#0e0e0e
);

border:1px solid var(--border);

border-radius:18px;

padding:17px;

margin-bottom:24px;

box-shadow:
0 14px 40px rgba(0,0,0,.28);

overflow:hidden;
}

.goal::before{
content:"";

position:absolute;

top:0;
right:0;

width:100px;
height:2px;

background:
linear-gradient(
90deg,
transparent,
var(--red)
);

box-shadow:
0 0 16px rgba(229,9,20,.7);
}

.goalHead{
display:flex;
justify-content:space-between;
align-items:center;

margin-bottom:15px;
}

.goalHead b{
font-size:16px;
font-weight:800;
}

.goalHead button{
background:
rgba(229,9,20,.12);

border:1px solid rgba(229,9,20,.4);

color:white;

border-radius:9px;

padding:8px 14px;

font-weight:bold;
font-size:11px;

cursor:pointer;

transition:.2s;
}

.goalHead button:hover{
background:var(--red);
border-color:var(--red);

box-shadow:
0 5px 15px rgba(229,9,20,.2);
}

.goalHead button:active{
transform:scale(.94);
}

/* ================= STATS ================= */

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:9px;
}

.stat{
position:relative;

background:
linear-gradient(
145deg,
#0b0b0b,
#101010
);

border:1px solid #222;

border-radius:13px;

padding:12px 8px;

text-align:center;

overflow:hidden;

transition:.2s;
}

.stat::before{
content:"";

position:absolute;

top:0;
left:20%;
right:20%;

height:1px;

background:rgba(229,9,20,.45);
}

.stat:hover{
border-color:#333;

transform:translateY(-1px);
}

.stat b{
display:block;

font-size:14px;
font-weight:800;

white-space:nowrap;
}

.stat small{
display:block;

color:#777;

font-size:10px;

margin-top:5px;
}

.progress{
height:6px;

background:#292929;

border-radius:20px;

overflow:hidden;

margin-top:9px;
}

.progress i{
display:block;

height:100%;

background:
linear-gradient(
90deg,
#8f0008,
var(--red),
var(--red-light)
);

width:0%;

border-radius:20px;

box-shadow:
0 0 10px rgba(229,9,20,.3);

transition:
width .45s ease;
}

/* ================= SECTION TITLES ================= */

.sectionTitle{
position:relative;

font-size:17px;
font-weight:800;

margin:24px 0 12px;

padding-right:11px;
}

.sectionTitle::before{
content:"";

position:absolute;

right:0;
top:50%;

transform:translateY(-50%);

width:3px;
height:19px;

background:var(--red);

border-radius:10px;

box-shadow:
0 0 10px rgba(229,9,20,.4);
}

/* ================= FOOD GRID ================= */

.foodGrid{
display:grid;

grid-template-columns:
repeat(4,minmax(0,1fr));

gap:9px;
}

.food{
position:relative;

background:
linear-gradient(
145deg,
#151515,
#0e0e0e
);

border:1px solid var(--border);

border-radius:14px;

padding:13px 7px;

text-align:center;

cursor:pointer;

min-height:88px;

display:flex;
flex-direction:column;
justify-content:center;

overflow:hidden;

transition:
transform .15s,
border-color .2s,
background .2s,
box-shadow .2s;
}

.food::after{
content:"+";

position:absolute;

top:6px;
left:8px;

color:#444;

font-size:12px;

transition:.2s;
}

.food:hover{
border-color:
rgba(229,9,20,.65);

background:
linear-gradient(
145deg,
#191919,
#101010
);

box-shadow:
0 9px 25px rgba(0,0,0,.3);
}

.food:hover::after{
color:var(--red);
}

.food:active{
transform:scale(.95);

border-color:var(--red);
}

.food b{
display:block;

font-size:12px;

font-weight:700;

line-height:1.5;
}

.food small{
display:block;

color:#777;

font-size:9px;

margin-top:6px;
}

/* ================= SELECTED ================= */

.selected{
background:
linear-gradient(
145deg,
#131313,
#0d0d0d
);

border:1px solid var(--border);

border-radius:16px;

overflow:hidden;

box-shadow:
0 12px 35px rgba(0,0,0,.22);
}

.empty{
padding:30px 15px;

text-align:center;

color:#5d5d5d;

font-size:13px;
}

.foodRow{
display:flex;

align-items:center;

justify-content:space-between;

gap:12px;

padding:14px;

border-bottom:1px solid #222;

transition:.2s;
}

.foodRow:last-child{
border-bottom:none;
}

.foodRow:hover{
background:#161616;
}

.foodInfo{
flex:1;
min-width:0;
}

.foodInfo b{
display:block;

font-size:13px;

font-weight:800;

margin-bottom:4px;
}

.foodInfo small{
display:block;

color:#777;

font-size:10px;

margin-top:4px;

line-height:1.7;
}

.deleteBtn{
flex-shrink:0;

background:#1d1d1d;

color:#bbb;

border:1px solid #2c2c2c;

border-radius:9px;

padding:8px 10px;

font-size:10px;

font-weight:bold;

cursor:pointer;

transition:.2s;
}

.deleteBtn:hover{
border-color:var(--red);

color:white;
}

.deleteBtn:active{
background:var(--red);

border-color:var(--red);

color:white;

transform:scale(.94);
}

.clearBtn{
display:block;

margin-top:11px;
margin-right:0;

background:#151515;

color:#aaa;

border:1px solid #292929;

border-radius:10px;

padding:9px 15px;

font-size:11px;

font-weight:bold;

cursor:pointer;

transition:.2s;
}

.clearBtn:hover{
color:white;

border-color:#3a3a3a;
}

.clearBtn:active{
background:var(--red);

color:white;

border-color:var(--red);

transform:scale(.96);
}

/* ================= FOOTER ================= */

footer{
text-align:center;

color:#444;

font-size:10px;

letter-spacing:1.5px;

margin-top:35px;
}

/* ================= MODALS ================= */

.modal{
display:none;

position:fixed;

inset:0;

background:
rgba(0,0,0,.78);

backdrop-filter:blur(8px);
-webkit-backdrop-filter:blur(8px);

z-index:50;

align-items:center;

justify-content:center;

padding:15px;

animation:fadeIn .2s ease;
}

@keyframes fadeIn{
from{
opacity:0;
}
to{
opacity:1;
}
}

.modalBox{
position:relative;

background:
linear-gradient(
145deg,
#181818,
#0e0e0e
);

border:1px solid #333;

border-radius:20px;

padding:20px;

width:100%;

max-width:430px;

box-shadow:
0 25px 80px rgba(0,0,0,.75);

max-height:90vh;

overflow-y:auto;

animation:modalUp .22s ease;
}

@keyframes modalUp{

from{
opacity:0;
transform:
translateY(15px)
scale(.97);
}

to{
opacity:1;
transform:
translateY(0)
scale(1);
}

}

.modalBox::before{
content:"";

position:absolute;

top:0;
right:25px;

width:70px;
height:2px;

background:var(--red);

box-shadow:
0 0 15px rgba(229,9,20,.55);
}

.modalBox h2{
font-size:19px;

font-weight:800;

margin-bottom:16px;
}

/* ================= INPUTS ================= */

.modalBox input,
.modalBox select{
width:100%;

height:46px;

padding:0 13px;

margin:5px 0;

background:#090909;

border:1px solid #303030;

border-radius:11px;

color:white;

outline:none;

font-size:13px;

transition:.2s;
}

.modalBox input::placeholder{
color:#666;
}

.modalBox input:focus,
.modalBox select:focus{
border-color:var(--red);

box-shadow:
0 0 0 3px rgba(229,9,20,.08);
}

.modalBox select{
cursor:pointer;
}

.modalBox select option{
background:#111;
color:white;
}

/* ================= UNITS ================= */

.units{
display:flex;

gap:7px;

margin:8px 0 10px;
}

.unitBtn{
flex:1;

height:40px;

padding:0 7px;

background:#191919;

border:1px solid #303030;

border-radius:10px;

color:#aaa;

font-size:11px;

font-weight:bold;

cursor:pointer;

transition:.2s;
}

.unitBtn:hover{
color:white;

border-color:#414141;
}

.unitBtn.active{
background:
linear-gradient(
135deg,
var(--red-light),
var(--red-dark)
);

border-color:var(--red);

color:white;

box-shadow:
0 6px 18px rgba(229,9,20,.18);
}

/* ================= HINT ================= */

.hint{
color:#777;

font-size:10px;

margin-top:6px;

line-height:1.6;
}

/* ================= PREVIEW ================= */

.preview{
background:#090909;

border-radius:12px;

padding:13px;

margin:11px 0;

font-size:11px;

line-height:2;

color:#aaa;

border:1px solid #242424;
}

.preview b{
color:#fff;

font-weight:800;
}

/* ================= ACTIONS ================= */

.actions{
display:flex;

gap:8px;

margin-top:8px;
}

.actions button{
flex:1;

height:44px;

padding:0 10px;

border:none;

border-radius:11px;

font-weight:bold;

font-size:12px;

cursor:pointer;

transition:.2s;
}

.addBtn{
background:
linear-gradient(
135deg,
var(--red-light),
var(--red-dark)
);

color:white;

box-shadow:
0 7px 20px rgba(229,9,20,.17);
}

.addBtn:hover{
filter:brightness(1.08);
}

.addBtn:active{
transform:scale(.96);

box-shadow:none;
}

.closeBtn{
background:#202020;

color:#aaa;

border:1px solid #303030 !important;
}

.closeBtn:hover{
background:#272727;

color:white;
}

.closeBtn:active{
transform:scale(.96);
}

/* ================= GOAL OPTIONS ================= */

.goalOptions{
display:grid;

grid-template-columns:1fr 1fr;

gap:8px;

margin:11px 0;
}

.goalOption{
min-height:48px;

background:#181818;

color:#999;

border:1px solid #303030;

border-radius:10px;

padding:8px;

font-size:10px;

font-weight:bold;

line-height:1.4;

cursor:pointer;

transition:.2s;
}

.goalOption:hover{
color:white;

border-color:#424242;
}

.goalOption.active{
background:
linear-gradient(
135deg,
var(--red-light),
var(--red-dark)
);

color:white;

border-color:var(--red);

box-shadow:
0 6px 18px rgba(229,9,20,.15);
}

/* ================= SCROLLBAR ================= */

::-webkit-scrollbar{
width:5px;
}

::-webkit-scrollbar-track{
background:#070707;
}

::-webkit-scrollbar-thumb{
background:#303030;

border-radius:10px;
}

::-webkit-scrollbar-thumb:hover{
background:var(--red);
}

/* ================= MOBILE ================= */

@media(max-width:700px){

header{
padding:16px 12px 14px;
}

.logo{
font-size:27px;
}

.container{
padding:
15px 12px 0;
}

.stats{
grid-template-columns:
repeat(2,1fr);
gap:8px;
}

.foodGrid{
grid-template-columns:
repeat(3,1fr);

gap:8px;
}

.food{
min-height:84px;

padding:11px 6px;
}

.food b{
font-size:11px;
}

.sectionTitle{
font-size:16px;
}

}

/* ================= SMALL MOBILE ================= */

@media(max-width:420px){

.container{
padding-left:10px;
padding-right:10px;
}

.logo{
font-size:25px;
}

.subtitle{
font-size:10px;
}

.goal{
padding:14px;

border-radius:16px;
}

.goalHead b{
font-size:14px;
}

.goalHead button{
padding:7px 11px;

font-size:10px;
}

.stat{
padding:10px 6px;
}

.stat b{
font-size:13px;
}

.foodGrid{
grid-template-columns:
repeat(3,1fr);

gap:6px;
}

.food{
min-height:78px;

border-radius:12px;
}

.food b{
font-size:10px;
}

.food small{
font-size:8px;
}

.foodRow{
padding:12px 10px;
}

.foodInfo b{
font-size:12px;
}

.foodInfo small{
font-size:9px;
}

.deleteBtn{
padding:7px 8px;

font-size:9px;
}

.modal{
padding:10px;
}

.modalBox{
padding:16px;

border-radius:17px;
}

}

/* ================= VERY SMALL ================= */

@media(max-width:350px){

.foodGrid{
grid-template-columns:
repeat(2,1fr);

gap:7px;
}

.food{
min-height:82px;
}

.goalOptions{
grid-template-columns:1fr;
}

.actions button{
height:42px;
}

}

/* ================= REDUCE MOTION ================= */

@media(prefers-reduced-motion:reduce){

*,
*::before,
*::after{
animation-duration:.01ms !important;

animation-iteration-count:1 !important;

transition-duration:.01ms !important;

scroll-behavior:auto !important;
}

}

</style>
</head>

<body>

<header>

<div class="logo">
SAYKØ <span>FITNESS</span>
</div>

<div class="subtitle">
Nutrition • Calories • Progress
</div>

<button id="installButton">
📱 تثبيت SAYKØ
</button>

</header>

<main class="container">

<input
id="search"
class="search"
placeholder="ابحث عن أكلة أو سناك..."
>

<section class="goal">

<div class="goalHead">

<b>هدفك اليومي</b>

<button onclick="openGoal()">
تعديل
</button>

</div>

<div class="stats">

<div class="stat">

<b id="calTotal">0 / 0</b>

<small>السعرات</small>

<div class="progress">
<i id="calBar"></i>
</div>

</div>

<div class="stat">

<b id="proTotal">0 / 0</b>

<small>بروتين</small>

<div class="progress">
<i id="proBar"></i>
</div>

</div>

<div class="stat">

<b id="carbTotal">0 / 0</b>

<small>كارب</small>

<div class="progress">
<i id="carbBar"></i>
</div>

</div>

<div class="stat">

<b id="fatTotal">0 / 0</b>

<small>دهون</small>

<div class="progress">
<i id="fatBar"></i>
</div>

</div>

</div>
</section>

<h2 class="sectionTitle">
الأطعمة والسناكس
</h2>

<div id="foodGrid" class="foodGrid"></div>

<h2 class="sectionTitle">
الأطعمة المختارة
</h2>

<div id="selected" class="selected">

<div class="empty">
لم تضف أي طعام بعد
</div>

</div>

<button class="clearBtn" onclick="clearAll()">
مسح الكل
</button>

</main>

<footer>
SAYKØ FITNESS
</footer>


<!-- FOOD MODAL -->

<div id="foodModal" class="modal">

<div class="modalBox">

<h2 id="foodTitle"></h2>

<div class="units">

<button
id="gramsBtn"
class="unitBtn active"
onclick="selectUnit('grams')">
جرام
</button>

<button
id="spoonBtn"
class="unitBtn"
onclick="selectUnit('spoon')">
معلقة كبيرة
</button>

<button
id="pieceBtn"
class="unitBtn"
style="display:none"
onclick="selectUnit('piece')">
قطعة
</button>

</div>

<input
id="quantity"
type="number"
min="0"
step="0.1"
value="100"
oninput="updatePreview()"
>

<div id="quantityHint" class="hint"></div>

<div id="preview" class="preview"></div>

<div class="actions">

<button class="addBtn" onclick="confirmFood()">
إضافة
</button>

<button class="closeBtn" onclick="closeFood()">
إلغاء
</button>

</div>

</div>
</div>


<!-- GOAL MODAL -->

<div id="goalModal" class="modal">

<div class="modalBox">

<h2>
احسب احتياجك اليومي
</h2>

<input
id="weight"
type="number"
placeholder="الوزن بالكجم"
>

<input
id="height"
type="number"
placeholder="الطول بالسنتيمتر"
>

<input
id="age"
type="number"
placeholder="العمر"
>

<select id="gender">

<option value="male">
ذكر
</option>

<option value="female">
أنثى
</option>

</select>

<select id="activity">

<option value="1.2">
قليل الحركة
</option>

<option value="1.375">
نشاط خفيف
</option>

<option value="1.55" selected>
نشاط متوسط
</option>

<option value="1.725">
نشاط عالي
</option>

</select>

<div class="goalOptions">

<button
class="goalOption active"
data-goal="build"
onclick="setGoalType(this)">
ضبط الدهون وبناء العضلات
</button>

<button
class="goalOption"
data-goal="maintain"
onclick="setGoalType(this)">
تثبيت الوزن
</button>

<button
class="goalOption"
data-goal="lose"
onclick="setGoalType(this)">
خسارة وزن تدريجية
</button>

<button
class="goalOption"
data-goal="gain"
onclick="setGoalType(this)">
زيادة الوزن
</button>

</div>

<div class="actions">

<button class="addBtn" onclick="calculateGoal()">
حفظ
</button>

<button class="closeBtn" onclick="closeGoal()">
إلغاء
</button>

</div>

</div>
</div>


<script>

/* ================= DATABASE ================= */

const foods = [

{name:"أرز أبيض مطبوخ",calories:130,carbs:28,protein:2.7,fat:.3},
{name:"أرز بني",calories:123,carbs:26,protein:2.7,fat:1},
{name:"أرز بسمتي",calories:121,carbs:25,protein:3,fat:.4},
{name:"أرز أصفر",calories:150,carbs:30,protein:3,fat:2},
{name:"مكرونة مسلوقة",calories:158,carbs:31,protein:6,fat:.9},

/* ================= RENDER ================= */

/* ================= OPEN FOOD ================= */

function openFood(index){

selectedFood=foods[index];

$("foodTitle").textContent=
selectedFood.name;

if(selectedFood.weight){

selectedUnit="piece";

$("pieceBtn").style.display="block";
$("gramsBtn").style.display="none";
$("spoonBtn").style.display="none";

}else{

selectedUnit="grams";

$("pieceBtn").style.display="none";
$("gramsBtn").style.display="block";
$("spoonBtn").style.display="block";

}

$("quantity").value=
selectedUnit==="piece" ? 1 : 100;

selectUnit(selectedUnit);

updatePreview();

$("foodModal").style.display="flex";

}


/* ================= UNIT ================= */

function selectUnit(unit){

selectedUnit=unit;

$("gramsBtn")
.classList
.toggle("active",unit==="grams");

$("spoonBtn")
.classList
.toggle("active",unit==="spoon");

$("pieceBtn")
.classList
.toggle("active",unit==="piece");

$("quantity").value=
unit==="piece" ? 1 : 100;

updatePreview();

}


/* ================= PREVIEW ================= */

function updatePreview(){

if(!selectedFood)return;

let q=
parseFloat($("quantity").value)||0;

let grams=q;

let label="جم";

if(selectedUnit==="spoon"){

grams=
q*getSpoonWeight(selectedFood);

label="معلقة";

}

if(selectedUnit==="piece"){

grams=
q*(selectedFood.weight||100);

label="قطعة";

}

if(selectedUnit==="spoon"){

$("quantityHint").textContent=
`المعلقة الكبيرة من ${selectedFood.name} ≈ ${getSpoonWeight(selectedFood)} جم`;

}else if(selectedUnit==="piece"){

$("quantityHint").textContent=
`القطعة ≈ ${selectedFood.weight} جم`;

}else{

$("quantityHint").textContent=
"القيمة محسوبة حسب الوزن بالجرام";

}

let factor=grams/100;

$("preview").innerHTML=`

≈

<b>${(selectedFood.calories*factor).toFixed(0)}</b>
kcal

<b>${(selectedFood.carbs*factor).toFixed(1)}g</b>

&nbsp; | &nbsp;

الدهون:
<b>${(selectedFood.fat*factor).toFixed(1)}g</b>

`;

}


/* ================= ADD FOOD ================= */

function confirmFood(){

if(!selectedFood)return;

let q=
parseFloat($("quantity").value)||0;

if(q<=0)return;

let grams;

if(selectedUnit==="spoon"){

grams=
q*getSpoonWeight(selectedFood);

}else if(selectedUnit==="piece"){

grams=
q*(selectedFood.weight||100);

}else{

grams=q;

}

let factor=grams/100;

selectedFoods.push({

name:selectedFood.name,
grams:grams,

calories:
selectedFood.calories*factor,

protein:
selectedFood.protein*factor,

carbs:
selectedFood.carbs*factor,

fat:
selectedFood.fat*factor,

display:
`${q} ${
selectedUnit==="spoon"
?"معلقة"
:selectedUnit==="piece"
?"قطعة"
:"جم"
}`

});

saveData();

closeFood();

renderSelected();

}

<div class="empty">
لم تضف أي طعام بعد
</div>

`;

updateStats();

return;

}

$("selected").innerHTML=

selectedFoods.map((food,index)=>`

<div class="foodRow">

<div class="foodInfo">

<b>${food.name}</b>

<small>

${food.display}

≈ ${food.grams.toFixed(1)} جم

•

${food.calories.toFixed(0)} kcal

•

بروتين ${food.protein.toFixed(1)}g

•

كارب ${food.carbs.toFixed(1)}g

•

دهون ${food.fat.toFixed(1)}g

</small>

</div>

<button
class="deleteBtn"
onclick="removeFood(${index})">

حذف

</button>

</div>

`).join("");

updateStats();

}


function removeFood(index){

selectedFoods.splice(index,1);

saveData();

renderSelected();

}


function clearAll(){

selectedFoods=[];

saveData();

renderSelected();

}


/* ================= SAVE ================= */

function saveData(){

localStorage.setItem(
"novarSelectedFoods",
JSON.stringify(selectedFoods)
);

localStorage.setItem(
"novarDailyGoals",
JSON.stringify(dailyGoal)
);

}


/* ================= STATS ================= */

function updateStats(){

let total=

selectedFoods.reduce(

(total,food)=>({

cal:total.cal+food.calories,
pro:total.pro+food.protein,
carb:total.carb+food.carbs,
fat:total.fat+food.fat

}),

{
cal:0,
pro:0,
carb:0,
fat:0
}

);

$("calTotal").textContent=
`${total.cal.toFixed(0)} / ${dailyGoal.calories}`;

$("proTotal").textContent=
`${total.pro.toFixed(1)} / ${dailyGoal.protein}`;

$("carbTotal").textContent=
`${total.carb.toFixed(1)} / ${dailyGoal.carbs}`;

$("fatTotal").textContent=
`${total.fat.toFixed(1)} / ${dailyGoal.fat}`;

$("calBar").style.width=
Math.min(
100,
dailyGoal.calories ?
total.cal/dailyGoal.calories*100 : 0
)+"%";

$("proBar").style.width=
Math.min(
100,
dailyGoal.protein ?
total.pro/dailyGoal.protein*100 : 0
)+"%";

$("carbBar").style.width=
Math.min(
100,
dailyGoal.carbs ?
total.carb/dailyGoal.carbs*100 : 0
)+"%";

$("fatBar").style.width=
Math.min(
100,
dailyGoal.fat ?
total.fat/dailyGoal.fat*100 : 0
)+"%";

}


/* ================= SEARCH ================= */

$("search").addEventListener(
"input",
function(){

let query=
this.value
.trim()
.toLowerCase();

if(!query){

renderFoods(foods);

return;

}

renderFoods(

foods.filter(food=>
food.name
.toLowerCase()
.includes(query)
)

);

});


/* ================= GOAL ================= */

function openGoal(){

$("weight").value=
localStorage.getItem("saykoWeight")||"";

$("height").value=
localStorage.getItem("saykoHeight")||"";

$("age").value=
localStorage.getItem("saykoAge")||"";

$("goalModal").style.display="flex";

}


function closeGoal(){

$("goalModal").style.display="none";

}


function setGoalType(button){

goalType=
button.dataset.goal;

document
.querySelectorAll(".goalOption")
.forEach(button=>
button.classList.remove("active")
);

button.classList.add("active");

}


/* ================= CALCULATE ================= */

function calculateGoal(){

let weight=
parseFloat($("weight").value);

let height=
parseFloat($("height").value);

let age=
parseFloat($("age").value);

let gender=
$("gender").value;

let activity=
parseFloat($("activity").value);

if(!weight||!height||!age){

alert("اكتب الوزن والطول والعمر");

return;

}

let bmr;

if(gender==="male"){

bmr=
10*weight+
6.25*height-
5*age+
5;

}else{

bmr=
10*weight+
6.25*height-
5*age-
161;

}

let calories=
bmr*activity;

if(goalType==="lose"){

calories-=250;

}

if(goalType==="gain"){

calories+=250;

}

let protein=
weight*1.8;

let fat=
weight*.8;

let carbs=
Math.max(
0,
(calories-
protein*4-
fat*9)/4
);

dailyGoal={

calories:
Math.round(calories),

protein:
Math.round(protein),

carbs:
Math.round(carbs),

fat:
Math.round(fat)

};

localStorage.setItem(
"saykoWeight",
weight
);

localStorage.setItem(
"saykoHeight",
height
);

localStorage.setItem(
"saykoAge",
age
);

saveData();

updateStats();

closeGoal();

}


/* ================= INITIAL ================= */

renderFoods();

renderSelected();

updateStats();


/* ================= PWA ================= */

let deferredInstallPrompt=null;

const installButton=
$("installButton");

window.addEventListener(
"beforeinstallprompt",
function(event){

event.preventDefault();

deferredInstallPrompt=event;

installButton.style.display="block";

});

installButton.addEventListener(
"click",
async function(){

if(!deferredInstallPrompt){
return;
}

deferredInstallPrompt.prompt();

await deferredInstallPrompt.userChoice;

deferredInstallPrompt=null;

installButton.style.display="none";

});

window.addEventListener(
"appinstalled",
function(){

installButton.style.display="none";

});

);

})
.catch(function(error){

console.log(

error
);

});

});

}
