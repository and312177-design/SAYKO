<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SAYKØ FITNESS</title>

<link rel="icon" type="image/jpeg" href="1790471069347.jpg">

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#080808">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Tahoma,sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#080808;
    color:#fff;
    min-height:100vh;
}

/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:100;
    background:#080808;
    border-bottom:1px solid #222;
    padding:18px 15px;
}

.headerInner{
    max-width:900px;
    margin:auto;
    text-align:center;
}

.logo{
    font-size:29px;
    font-weight:900;
    letter-spacing:1px;
}

.logo span{
    color:#e50914;
}

.subtitle{
    color:#aaa;
    font-size:12px;
    margin-top:5px;
    letter-spacing:.5px;
}

.installBtn{
    display:none;
    margin:12px auto 0;
    background:#e50914;
    color:#fff;
    border:0;
    padding:10px 18px;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

/* CONTAINER */

.container{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:18px 12px 40px;
}

/* SEARCH */

.searchBox{
    margin-bottom:15px;
}

.searchBox input{
    width:100%;
    padding:14px;
    background:#111;
    border:1px solid #333;
    border-radius:12px;
    color:#fff;
    outline:none;
    font-size:15px;
}

.searchBox input:focus{
    border-color:#e50914;
}

.searchBox input::placeholder{
    color:#777;
}

/* GOAL */

.goal{
    background:#111;
    border:1px solid #242424;
    border-radius:15px;
    padding:15px;
    margin-bottom:15px;
}

.goalHeader{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
}

.goalTitle{
    font-size:18px;
    font-weight:bold;
}

.editBtn{
    background:#222;
    color:#fff;
    border:1px solid #333;
    border-radius:8px;
    padding:7px 12px;
    cursor:pointer;
}

.editBtn:hover{
    background:#e50914;
    border-color:#e50914;
}

/* STATS */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.stat{
    background:#080808;
    border:1px solid #242424;
    border-radius:10px;
    padding:10px;
}

.statName{
    font-size:12px;
    color:#aaa;
    margin-bottom:7px;
}

.statValue{
    font-size:14px;
    font-weight:bold;
}

.progress{
    height:6px;
    background:#292929;
    border-radius:10px;
    overflow:hidden;
    margin-top:8px;
}

.progress div{
    height:100%;
    width:0%;
    background:#e50914;
    transition:.3s;
}

/* SECTION */

.sectionTitle{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:20px 0 12px;
}

.sectionTitle h2{
    font-size:19px;
}

.clearBtn{
    background:#222;
    color:#fff;
    border:1px solid #333;
    border-radius:8px;
    padding:7px 11px;
    cursor:pointer;
}

.clearBtn:hover{
    background:#e50914;
}

/* FOOD GRID */

.foodGrid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.food{
    background:#111;
    border:1px solid #242424;
    border-radius:12px;
    min-height:82px;
    padding:10px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    justify-content:center;
    transition:.2s;
}

.food:hover{
    border-color:#e50914;
    transform:translateY(-1px);
}

.food b{
    font-size:13px;
    margin-bottom:6px;
}

.food small{
    color:#888;
    font-size:10px;
}

/* SELECTED */

.selected{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.foodRow{
    background:#111;
    border:1px solid #242424;
    border-radius:12px;
    padding:12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.foodInfo{
    min-width:0;
}

.foodInfo b{
    display:block;
    font-size:14px;
    margin-bottom:5px;
}

.foodInfo small{
    color:#999;
    font-size:11px;
    line-height:1.6;
}

.deleteBtn{
    background:#222;
    color:#fff;
    border:1px solid #333;
    border-radius:8px;
    padding:8px 10px;
    cursor:pointer;
    flex-shrink:0;
}

.deleteBtn:hover{
    background:#e50914;
    border-color:#e50914;
}

.empty{
    text-align:center;
    color:#777;
    padding:25px;
    background:#111;
    border:1px solid #242424;
    border-radius:12px;
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:500;
    background:rgba(0,0,0,.82);
    align-items:center;
    justify-content:center;
    padding:15px;
}

.modalBox{
    width:100%;
    max-width:450px;
    background:#111;
    border:1px solid #333;
    border-radius:16px;
    padding:18px;
    max-height:90vh;
    overflow-y:auto;
}

.modalHeader{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:15px;
}

.modalHeader h3{
    font-size:19px;
}

.closeBtn{
    width:34px;
    height:34px;
    border:1px solid #333;
    background:#222;
    color:#fff;
    border-radius:8px;
    cursor:pointer;
    font-size:18px;
}

.closeBtn:hover{
    background:#e50914;
}

/* UNIT BUTTONS */

.unitButtons{
    display:flex;
    gap:7px;
    margin-bottom:12px;
}

.unitBtn{
    flex:1;
    padding:10px;
    background:#222;
    color:#fff;
    border:1px solid #333;
    border-radius:9px;
    cursor:pointer;
}

.unitBtn.active{
    background:#e50914;
    border-color:#e50914;
}

/* INPUT */

.inputGroup{
    margin-bottom:12px;
}

.inputGroup label{
    display:block;
    color:#bbb;
    font-size:13px;
    margin-bottom:6px;
}

.inputGroup input,
.inputGroup select{
    width:100%;
    padding:12px;
    background:#080808;
    color:#fff;
    border:1px solid #333;
    border-radius:9px;
    outline:none;
}

.inputGroup input:focus,
.inputGroup select:focus{
    border-color:#e50914;
}

.quantityHint{
    color:#777;
    font-size:11px;
    margin-top:6px;
}

/* PREVIEW */

.preview{
    background:#080808;
    border:1px solid #292929;
    border-radius:10px;
    padding:12px;
    line-height:1.8;
    color:#bbb;
    font-size:13px;
    margin:12px 0;
}

.preview b{
    color:#fff;
}

/* MAIN BUTTON */

.mainBtn{
    width:100%;
    background:#e50914;
    color:#fff;
    border:0;
    border-radius:10px;
    padding:13px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.mainBtn:hover{
    background:#c70811;
}

/* GOAL OPTIONS */

.goalOptions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:10px;
}

.goalOption{
    background:#222;
    color:#fff;
    border:1px solid #333;
    border-radius:9px;
    padding:11px 7px;
    cursor:pointer;
    font-size:12px;
}

.goalOption.active{
    background:#e50914;
    border-color:#e50914;
}

/* FOOTER */

footer{
    text-align:center;
    color:#666;
    font-size:11px;
    padding:25px 10px;
}

/* MOBILE */

@media(max-width:600px){

    .container{
        padding:15px 10px 35px;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .foodGrid{
        grid-template-columns:repeat(3,1fr);
    }

    .logo{
        font-size:27px;
    }

}

@media(max-width:350px){

    .foodGrid{
        grid-template-columns:repeat(2,1fr);
    }

    .food{
        min-height:75px;
    }

    .food b{
        font-size:12px;
    }

}

</style>

</head>

<header>

<div class="headerInner">

<div class="logo">
SAYKØ <span>FITNESS</span>
</div>

<div class="subtitle">
Nutrition • Calories • Progress
</div>

<button id="installButton" class="installBtn">
📱 تثبيت SAYKØ
</button>

</div>

</header>


<main class="container">


<!-- SEARCH -->

<div class="searchBox">

<input
id="search"

placeholder="ابحث عن أكلة..."
autocomplete="off">

</div>


<!-- DAILY GOAL -->

<div class="goal">

<div class="goalTitle">
هدفك اليومي
</div>

<button class="editBtn" onclick="openGoal()">
تعديل
</button>

</div>


<div class="stats">

<div class="stat">

<div class="statName">
السعرات
</div>

<div class="statValue" id="calTotal">
0 / 2500
</div>

<div class="progress">
<div id="calBar"></div>
</div>

</div>


<div class="stat">

<div class="statName">
البروتين
</div>

<div class="statValue" id="proTotal">
0 / 150
</div>

<div class="progress">
<div id="proBar"></div>
</div>

</div>


<div class="stat">

<div class="statName">
الكارب
</div>

<div class="statValue" id="carbTotal">
0 / 300
</div>

<div class="progress">
<div id="carbBar"></div>
</div>

</div>


<div class="stat">

<div class="statName">
الدهون
</div>

<div class="statValue" id="fatTotal">
0 / 80
</div>

<div class="progress">
<div id="fatBar"></div>
</div>

</div>

</div>

</div>


<!-- FOODS -->

<div class="sectionTitle">

<h2>
الأطعمة
</h2>

</div>


<div id="foodGrid" class="foodGrid"></div>


<!-- SELECTED -->

<div class="sectionTitle">

<h2>
الأطعمة المختارة
</h2>

<button class="clearBtn" onclick="clearAll()">
مسح الكل
</button>

</div>


<div id="selected" class="selected"></div>


</main>


<footer>
SAYKØ FITNESS
</footer>


<!-- FOOD MODAL -->

<div id="foodModal" class="modal">

<div class="modalBox">

<div class="modalHeader">

<h3 id="foodTitle">
الطعام
</h3>

<button class="closeBtn" onclick="closeFood()">
×
</button>

</div>


<div class="unitButtons">

<button
id="gramsBtn"
class="unitBtn active"
onclick="selectUnit('grams')">

جرام

</button>


<button
id="spoonBtn"
class="unitBtn"
onclick="selectUnit('spoon')">

معلقة

</button>


<button
id="pieceBtn"
class="unitBtn"
onclick="selectUnit('piece')"
style="display:none">

قطعة

</button>

</div>


<div class="inputGroup">

<label>
الكمية
</label>

<input
id="quantity"
type="number"
min="0"
step="0.1"
value="100"
oninput="updatePreview()">

<div id="quantityHint" class="quantityHint">
القيمة محسوبة حسب الوزن بالجرام
</div>

</div>


<div id="preview" class="preview"></div>


<button class="mainBtn" onclick="confirmFood()">
إضافة للطعام
</button>

</div>

</div>


<!-- GOAL MODAL -->

<div id="goalModal" class="modal">

<div class="modalBox">

<div class="modalHeader">

<h3>
احسب احتياجك اليومي
</h3>

<button class="closeBtn" onclick="closeGoal()">
×
</button>

</div>


<div class="inputGroup">

<label>
الوزن بالكيلو
</label>

<input
id="weight"
type="number"
placeholder="مثال: 65">

</div>


<div class="inputGroup">

<label>
الطول بالسنتيمتر
</label>

<input
id="height"
type="number"
placeholder="مثال: 170">

</div>


<div class="inputGroup">

<label>
العمر
</label>

<input
id="age"
type="number"
placeholder="مثال: 17">

</div>


<div class="inputGroup">

<label>
الجنس
</label>

<select id="gender">

<option value="male">
ذكر
</option>

<option value="female">
أنثى
</option>

</select>

</div>


<div class="inputGroup">

<label>
مستوى النشاط
</label>

<select id="activity">

<option value="1.2">
قليل الحركة
</option>

<option value="1.375">
نشاط خفيف
</option>

<option value="1.55" selected>
نشاط متوسط
</option>

<option value="1.725">
نشاط عالي
</option>

</select>

</div>


<div class="inputGroup">

<label>
الهدف
</label>

<div class="goalOptions">

<button
class="goalOption active"
data-goal="build"
onclick="setGoalType(this)">

ضبط الدهون وبناء العضلات

</button>

<button
class="goalOption"
data-goal="maintain"
onclick="setGoalType(this)">

تثبيت الوزن

</button>

<button
class="goalOption"
data-goal="lose"
onclick="setGoalType(this)">

خسارة وزن تدريجية

</button>

<button
class="goalOption"
data-goal="gain"
onclick="setGoalType(this)">

زيادة الوزن

</button>

</div>

</div>


<button class="mainBtn" onclick="calculateGoal()">
احسب احتياجي
</button>

</div>

</div>

========================= */

let selectedFood=null;

let selectedUnit="grams";

JSON.parse(
localStorage.getItem("novarSelectedFoods") || "[]"
);

JSON.parse(
localStorage.getItem("novarDailyGoals") || "null"
) || {

calories:2500,

fat:80

};

let goalType="build";


const $=id=>document.getElementById(id);


function getSpoonWeight(food){

return spoonWeights[food.name] || 10;

}


/* =========================
   RENDER FOODS
========================= */

function renderFoods(list=foods){

$("foodGrid").innerHTML=list.map((food,index)=>`

<div
class="food"
onclick="openFood(${foods.indexOf(food)})">

<b>${food.name}</b>

<small>
${food.calories} kcal / 100g
</small>

</div>

`).join("");

}


/* =========================
   OPEN FOOD
========================= */

function openFood(index){

selectedFood=foods[index];

$("foodTitle").textContent=selectedFood.name;


if(selectedFood.weight){

selectedUnit="piece";

$("pieceBtn").style.display="block";

$("gramsBtn").style.display="none";

$("spoonBtn").style.display="none";

}else{

selectedUnit="grams";

$("pieceBtn").style.display="none";

$("gramsBtn").style.display="block";

$("spoonBtn").style.display="block";

}


$("quantity").value=
selectedUnit==="piece" ? 1 : 100;


selectUnit(selectedUnit);

updatePreview();

$("foodModal").style.display="flex";

}


/* =========================
   UNIT
========================= */

function selectUnit(unit){

selectedUnit=unit;

$("gramsBtn").classList.toggle(
"active",
unit==="grams"
);

$("spoonBtn").classList.toggle(
"active",
unit==="spoon"
);

$("pieceBtn").classList.toggle(
"active",
unit==="piece"
);


if(unit==="piece"){

$("quantity").value=1;

}else{

$("quantity").value=100;

}


updatePreview();

}


/* =========================
   PREVIEW
========================= */

function updatePreview(){

if(!selectedFood)return;


let q=parseFloat($("quantity").value)||0;

let grams=q;

let label="جم";


if(selectedUnit==="spoon"){

grams=q*getSpoonWeight(selectedFood);

label="معلقة";

}


if(selectedUnit==="piece"){

grams=q*(selectedFood.weight||100);

label="قطعة";

}


if(selectedUnit==="spoon"){

$("quantityHint").textContent=
`المعلقة الكبيرة من ${selectedFood.name} ≈ ${getSpoonWeight(selectedFood)} جم`;

}else if(selectedUnit==="piece"){

$("quantityHint").textContent=
`القطعة ≈ ${selectedFood.weight} جم`;

}else{

$("quantityHint").textContent=
"القيمة محسوبة حسب الوزن بالجرام";

}


let factor=grams/100;


$("preview").innerHTML=`

الكمية:
<b>${q} ${label}</b>
≈
<b>${grams.toFixed(1)} جم</b>

<br>

السعرات:
<b>${(selectedFood.calories*factor).toFixed(0)}</b>
kcal

<br>

البروتين:
<b>${(selectedFood.protein*factor).toFixed(1)}g</b>

&nbsp; | &nbsp;

الكارب:
<b>${(selectedFood.carbs*factor).toFixed(1)}g</b>

&nbsp; | &nbsp;

الدهون:
<b>${(selectedFood.fat*factor).toFixed(1)}g</b>

`;

}


/* =========================
   CONFIRM FOOD
========================= */

function confirmFood(){

if(!selectedFood)return;


let q=parseFloat($("quantity").value)||0;


if(q<=0)return;


let grams;


if(selectedUnit==="spoon"){

grams=q*getSpoonWeight(selectedFood);

}else if(selectedUnit==="piece"){

grams=q*(selectedFood.weight||100);

}else{

grams=q;

}


let factor=grams/100;


selectedFoods.push({

name:selectedFood.name,

grams:grams,

calories:selectedFood.calories*factor,

protein:selectedFood.protein*factor,

carbs:selectedFood.carbs*factor,

fat:selectedFood.fat*factor,

display:
`${q} ${
selectedUnit==="spoon"
?"معلقة"
:selectedUnit==="piece"
?"قطعة"
:"جم"
}`

});


saveData();

closeFood();

renderSelected();

}


/* =========================
   CLOSE FOOD
========================= */

function closeFood(){

$("foodModal").style.display="none";

}


/* =========================
   RENDER SELECTED
========================= */

function renderSelected(){

if(!selectedFoods.length){

$("selected").innerHTML=
`<div class="empty">
لم تضف أي طعام بعد
</div>`;

updateStats();

return;

}


$("selected").innerHTML=

selectedFoods.map((food,index)=>`

<div class="foodRow">

<div class="foodInfo">

<b>
${food.name}
</b>

<small>

${food.display}
≈
${food.grams.toFixed(1)} جم

•

${food.calories.toFixed(0)} kcal

•

بروتين
${food.protein.toFixed(1)}g

•

كارب
${food.carbs.toFixed(1)}g

•

دهون
${food.fat.toFixed(1)}g

</small>

</div>

<button
class="deleteBtn"
onclick="removeFood(${index})">

حذف

</button>

</div>

`).join("");


updateStats();

}


/* =========================
   REMOVE
========================= */

function removeFood(index){

selectedFoods.splice(index,1);

saveData();

renderSelected();

}


/* =========================
   CLEAR
========================= */

function clearAll(){

selectedFoods=[];

saveData();

renderSelected();

}


/* =========================
   SAVE
========================= */

function saveData(){

localStorage.setItem(
"novarSelectedFoods",
JSON.stringify(selectedFoods)
);

localStorage.setItem(
"novarDailyGoals",
JSON.stringify(dailyGoal)
);

}


/* =========================
   UPDATE STATS
========================= */

function updateStats(){

let total=selectedFoods.reduce(

(total,food)=>({

cal:total.cal+food.calories,

pro:total.pro+food.protein,

carb:total.carb+food.carbs,

fat:total.fat+food.fat

}),

{
cal:0,
pro:0,
carb:0,
fat:0
}

);


$("calTotal").textContent=
`${total.cal.toFixed(0)} / ${dailyGoal.calories}`;

$("proTotal").textContent=
`${total.pro.toFixed(1)} / ${dailyGoal.protein}`;

$("carbTotal").textContent=
`${total.carb.toFixed(1)} / ${dailyGoal.carbs}`;

$("fatTotal").textContent=
`${total.fat.toFixed(1)} / ${dailyGoal.fat}`;


$("calBar").style.width=
Math.min(
100,
total.cal/dailyGoal.calories*100
)+"%";


$("proBar").style.width=
Math.min(
100,
total.pro/dailyGoal.protein*100
)+"%";


$("carbBar").style.width=
Math.min(
100,
total.carb/dailyGoal.carbs*100
)+"%";


$("fatBar").style.width=
Math.min(
100,
total.fat/dailyGoal.fat*100
)+"%";

}

localStorage.getItem("saykoWeight")||"";

}


/* =========================
   GOAL TYPE
========================= */

function setGoalType(button){

goalType=button.dataset.goal;


document
.querySelectorAll(".goalOption")
.forEach(button=>
button.classList.remove("active")
);


button.classList.add("active");

}


/* =========================
   CALCULATE GOAL
========================= */

function calculateGoal(){

let weight=
parseFloat($("weight").value);

let height=
parseFloat($("height").value);

let age=
parseFloat($("age").value);

let gender=
$("gender").value;

let activity=
parseFloat($("activity").value);


if(!weight||!height||!age){

alert("اكتب الوزن والطول والعمر");

return;

}


let bmr;


if(gender==="male"){

bmr=
10*weight+
6.25*height-
5*age+
5;

}else{

bmr=
10*weight+
6.25*height-
5*age-
161;

}


let calories=
bmr*activity;


if(goalType==="lose")
calories-=250;


if(goalType==="gain")
calories+=250;


let protein=
weight*1.8;

let fat=
weight*.8;

let carbs=
Math.max(
0,
(calories-protein*4-fat*9)/4
);


dailyGoal={

calories:Math.round(calories),

protein:Math.round(protein),

carbs:Math.round(carbs),

fat:Math.round(fat)

};


localStorage.setItem(
"saykoWeight",
weight
);

localStorage.setItem(
"saykoHeight",
height
);

localStorage.setItem(
"saykoAge",
age
);


saveData();

updateStats();

closeGoal();

}

renderFoods();

========================= */

let deferredInstallPrompt=null;

const installButton=
$("installButton");


window.addEventListener(
"beforeinstallprompt",
function(event){

event.preventDefault();

deferredInstallPrompt=event;

installButton.style.display="block";

});


installButton.addEventListener(
"click",
async function(){

if(!deferredInstallPrompt)return;


deferredInstallPrompt.prompt();

await deferredInstallPrompt.userChoice;

deferredInstallPrompt=null;

installButton.style.display="none";

});


window.addEventListener(
"appinstalled",
function(){

installButton.style.display="none";

});
