<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,Tahoma,sans-serif;
}

body{
background:#080808;
color:#fff;
min-height:100vh;
padding-bottom:40px;
}

header{
padding:18px 14px;
text-align:center;
border-bottom:1px solid #222;
position:sticky;
top:0;
z-index:10;
background:#080808;
}

.logo{
font-size:29px;
font-weight:900;
letter-spacing:2px;
}

.logo span{
color:#e50914;
}

.subtitle{
color:#999;
font-size:12px;
margin-top:5px;
}

#installButton{
display:none;
margin:12px auto 0;
background:#e50914;
color:#fff;
border:none;
border-radius:10px;
padding:10px 16px;
font-weight:bold;
}

.container{
max-width:900px;
margin:auto;
padding:15px;
}

.search{
width:100%;
padding:14px;
background:#111;
border:1px solid #333;
border-radius:12px;
color:white;
outline:none;
margin-bottom:15px;
font-size:14px;
}

.search::placeholder{
color:#777;
}

.goal{
background:#111;
border:1px solid #242424;
border-radius:15px;
padding:15px;
margin-bottom:18px;
}

.goalHead{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:13px;
}

.goalHead button{
background:#e50914;
border:none;
color:white;
border-radius:8px;
padding:8px 13px;
font-weight:bold;
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
}

.stat{
background:#080808;
border-radius:10px;
padding:10px;
text-align:center;
}

.stat b{
display:block;
font-size:15px;
}

.stat small{
display:block;
color:#888;
font-size:10px;
margin-top:4px;
}

.progress{
height:6px;
background:#292929;
border-radius:10px;
overflow:hidden;
margin-top:7px;
}

.progress i{
display:block;
height:100%;
background:#e50914;
width:0%;
}

.sectionTitle{
font-size:18px;
margin:18px 0 10px;
}

.foodGrid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
}

.food{
background:#111;
border:1px solid #242424;
border-radius:12px;
padding:11px 7px;
text-align:center;
cursor:pointer;
min-height:82px;
transition:.15s;
}

.food:active{
transform:scale(.97);
}

.food b{
display:block;
font-size:13px;
line-height:1.4;
}

.food small{
display:block;
color:#888;
font-size:9px;
margin-top:5px;
}

.selected{
background:#111;
border:1px solid #242424;
border-radius:13px;
overflow:hidden;
}

.empty{
padding:22px;
text-align:center;
color:#666;
}

.foodRow{
display:flex;
align-items:center;
justify-content:space-between;
gap:8px;
padding:12px;
border-bottom:1px solid #222;
}

.foodRow:last-child{
border-bottom:none;
}

.foodInfo{
flex:1;
}

.foodInfo b{
display:block;
font-size:14px;
}

.foodInfo small{
display:block;
color:#888;
font-size:10px;
margin-top:4px;
line-height:1.6;
}

.deleteBtn{
background:#222;
color:white;
border:none;
border-radius:7px;
padding:7px 9px;
}

.clearBtn{
margin-top:10px;
background:#222;
color:white;
border:none;
border-radius:9px;
padding:9px 14px;
}

footer{
text-align:center;
color:#555;
font-size:12px;
margin-top:25px;
}

/* MODALS */

.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.82);
z-index:50;
align-items:center;
justify-content:center;
padding:15px;
}

.modalBox{
background:#111;
border:1px solid #333;
border-radius:16px;
padding:18px;
width:100%;
max-width:420px;
}

.modalBox h2{
font-size:19px;
margin-bottom:14px;
}

.modalBox input,
.modalBox select{
width:100%;
padding:12px;
margin:6px 0;
background:#080808;
border:1px solid #333;
border-radius:9px;
color:white;
outline:none;
}

.units{
display:flex;
gap:7px;
margin:8px 0;
}

.unitBtn{
flex:1;
padding:10px;
background:#222;
border:1px solid #333;
border-radius:9px;
color:white;
}

.unitBtn.active{
background:#e50914;
border-color:#e50914;
}

.hint{
color:#888;
font-size:11px;
margin-top:5px;
}

.preview{
background:#080808;
border-radius:10px;
padding:11px;
margin:10px 0;
font-size:12px;
line-height:1.8;
color:#ddd;
}

.actions{
display:flex;
gap:8px;
}

.actions button{
flex:1;
padding:11px;
border:none;
border-radius:9px;
font-weight:bold;
}

.addBtn{
background:#e50914;
color:white;
}

.closeBtn{
background:#222;
color:white;
}

.goalOptions{
display:grid;
grid-template-columns:1fr 1fr;
gap:7px;
margin:9px 0;
}

.goalOption{
background:#222;
color:white;
border:1px solid #333;
border-radius:8px;
padding:9px;
font-size:11px;
}

.goalOption.active{
background:#e50914;
border-color:#e50914;
}

/* MOBILE */

@media(max-width:600px){

.stats{
grid-template-columns:repeat(2,1fr);
}

.foodGrid{
grid-template-columns:repeat(3,1fr);
}

}

@media(max-width:350px){

.foodGrid{
grid-template-columns:repeat(2,1fr);
}

}

</style>
</head>

<div class="progress">

</div>

</div>

<b id="carbTotal">0 / 0</b>

<div class="progress">
<i id="carbBar"></i>
</div>

</div>

<div class="stat">

<b id="fatTotal">0 / 0</b>

<small>دهون</small>

<div class="progress">
<i id="fatBar"></i>
</div>

</div>

</div>
</section>

<h2 class="sectionTitle">
الأطعمة والسناكس

<div id="foodGrid" class="foodGrid"></div>

<h2 class="sectionTitle">
الأطعمة المختارة
</h2>

<div id="selected" class="selected">

</div>

<button class="clearBtn" onclick="clearAll()">

</button>

</main>

<footer>
SAYKØ FITNESS
</footer>


<!-- FOOD MODAL -->

<div id="foodModal" class="modal">

<div class="modalBox">

<h2 id="foodTitle"></h2>

<div class="units">

<button
id="gramsBtn"
class="unitBtn active"
onclick="selectUnit('grams')">
جرام
</button>

<button
id="spoonBtn"
class="unitBtn"
onclick="selectUnit('spoon')">
معلقة كبيرة
</button>

<button
id="pieceBtn"
class="unitBtn"
style="display:none"
onclick="selectUnit('piece')">
قطعة
</button>

</div>

<input
id="quantity"
type="number"
min="0"
step="0.1"
value="100"
oninput="updatePreview()"
>

<div id="quantityHint" class="hint"></div>

<div id="preview" class="preview"></div>

<div class="actions">

<button class="addBtn" onclick="confirmFood()">
إضافة
</button>

<button class="closeBtn" onclick="closeFood()">
إلغاء
</button>

</div>

</div>
</div>


<!-- GOAL MODAL -->

<div id="goalModal" class="modal">

<div class="modalBox">

<h2>
احسب احتياجك اليومي
</h2>

<input
id="weight"
type="number"
placeholder="الوزن بالكجم"
>

<input
id="height"
type="number"
placeholder="الطول بالسنتيمتر"
>

<input
id="age"
type="number"
placeholder="العمر"
>

<select id="gender">

<option value="male">
ذكر
</option>

<option value="female">
أنثى
</option>

</select>

<select id="activity">

<option value="1.2">
قليل الحركة
</option>

<option value="1.375">
نشاط خفيف
</option>

<option value="1.55" selected>
نشاط متوسط
</option>

<option value="1.725">
نشاط عالي
</option>

</select>

<div class="goalOptions">

<button
class="goalOption active"
data-goal="build"
onclick="setGoalType(this)">
ضبط الدهون وبناء العضلات
</button>

<button
class="goalOption"
data-goal="maintain"
onclick="setGoalType(this)">
تثبيت الوزن
</button>

<button
class="goalOption"
data-goal="lose"
onclick="setGoalType(this)">
خسارة وزن تدريجية
</button>

<button
class="goalOption"
data-goal="gain"
onclick="setGoalType(this)">
زيادة الوزن
</button>

</div>

<div class="actions">

<button class="addBtn" onclick="calculateGoal()">
حفظ
</button>

<button class="closeBtn" onclick="closeGoal()">
إلغاء
</button>

</div>

</div>
</div>

/* ================= VARIABLES ================= */

let selectedFood=null;
let selectedUnit="grams";

let selectedFoods=
JSON.parse(
localStorage.getItem("novarSelectedFoods") || "[]"
);

let dailyGoal=
JSON.parse(
localStorage.getItem("novarDailyGoals") || "null"
) || {

calories:2500,
protein:150,
carbs:300,
fat:80

};

let goalType="build";


const $=id=>document.getElementById(id);


function getSpoonWeight(food){

return spoonWeights[food.name] || 10;

}


/* ================= RENDER ================= */

function renderFoods(list=foods){

$("foodGrid").innerHTML=

list.map(food=>`

<div
class="food"
onclick="openFood(${foods.indexOf(food)})">

<b>${food.name}</b>

<small>
${food.calories} kcal / 100g
</small>

</div>

`).join("");

}


/* ================= OPEN FOOD ================= */

function openFood(index){

selectedFood=foods[index];

$("foodTitle").textContent=
selectedFood.name;

if(selectedFood.weight){

selectedUnit="piece";

$("pieceBtn").style.display="block";
$("gramsBtn").style.display="none";
$("spoonBtn").style.display="none";

}else{

selectedUnit="grams";

$("pieceBtn").style.display="none";
$("gramsBtn").style.display="block";
$("spoonBtn").style.display="block";

}

$("quantity").value=
selectedUnit==="piece" ? 1 : 100;

selectUnit(selectedUnit);

updatePreview();

$("foodModal").style.display="flex";

}


/* ================= UNIT ================= */

function selectUnit(unit){

selectedUnit=unit;

$("gramsBtn")
.classList
.toggle("active",unit==="grams");

$("spoonBtn")
.classList
.toggle("active",unit==="spoon");

$("pieceBtn")
.classList
.toggle("active",unit==="piece");

$("quantity").value=
unit==="piece" ? 1 : 100;

updatePreview();

}


/* ================= PREVIEW ================= */

function updatePreview(){

if(!selectedFood)return;

let q=
parseFloat($("quantity").value)||0;

let grams=q;

let label="جم";

if(selectedUnit==="spoon"){

grams=
q*getSpoonWeight(selectedFood);

label="معلقة";

}

if(selectedUnit==="piece"){

grams=
q*(selectedFood.weight||100);

label="قطعة";

}

if(selectedUnit==="spoon"){

$("quantityHint").textContent=
`المعلقة الكبيرة من ${selectedFood.name} ≈ ${getSpoonWeight(selectedFood)} جم`;

}else if(selectedUnit==="piece"){

$("quantityHint").textContent=
`القطعة ≈ ${selectedFood.weight} جم`;

}else{

$("quantityHint").textContent=
"القيمة محسوبة حسب الوزن بالجرام";

}

let factor=grams/100;

$("preview").innerHTML=`

الكمية:
<b>${q} ${label}</b>
≈
<b>${grams.toFixed(1)} جم</b>

<br>

السعرات:
<b>${(selectedFood.calories*factor).toFixed(0)}</b>
kcal

<br>

البروتين:
<b>${(selectedFood.protein*factor).toFixed(1)}g</b>

&nbsp; | &nbsp;

الكارب:
<b>${(selectedFood.carbs*factor).toFixed(1)}g</b>

&nbsp; | &nbsp;

الدهون:
<b>${(selectedFood.fat*factor).toFixed(1)}g</b>

`;

}


/* ================= ADD FOOD ================= */

function confirmFood(){

if(!selectedFood)return;

let q=
parseFloat($("quantity").value)||0;

if(q<=0)return;

let grams;

if(selectedUnit==="spoon"){

grams=
q*getSpoonWeight(selectedFood);

}else if(selectedUnit==="piece"){

grams=
q*(selectedFood.weight||100);

}else{

grams=q;

}

let factor=grams/100;

selectedFoods.push({

name:selectedFood.name,
grams:grams,

calories:
selectedFood.calories*factor,

protein:
selectedFood.protein*factor,

carbs:
selectedFood.carbs*factor,

fat:
selectedFood.fat*factor,

display:
`${q} ${
selectedUnit==="spoon"
?"معلقة"
:selectedUnit==="piece"
?"قطعة"
:"جم"
}`

});

saveData();

closeFood();

renderSelected();

}


function closeFood(){

$("foodModal").style.display="none";

}


/* ================= SELECTED ================= */

function renderSelected(){

if(!selectedFoods.length){

$("selected").innerHTML=`

<div class="empty">
لم تضف أي طعام بعد
</div>

`;

updateStats();

return;

}

$("selected").innerHTML=

selectedFoods.map((food,index)=>`

<div class="foodRow">

<div class="foodInfo">

<b>${food.name}</b>

<small>

${food.display}

≈ ${food.grams.toFixed(1)} جم

•

${food.calories.toFixed(0)} kcal

•

بروتين ${food.protein.toFixed(1)}g

•

كارب ${food.carbs.toFixed(1)}g

•

دهون ${food.fat.toFixed(1)}g

</small>

</div>

<button
class="deleteBtn"
onclick="removeFood(${index})">

حذف

</button>

</div>

`).join("");

updateStats();

}


function removeFood(index){

selectedFoods.splice(index,1);

saveData();

renderSelected();

}


function clearAll(){

selectedFoods=[];

saveData();

renderSelected();

}


/* ================= SAVE ================= */

function saveData(){

localStorage.setItem(
"novarSelectedFoods",
JSON.stringify(selectedFoods)
);

localStorage.setItem(
"novarDailyGoals",
JSON.stringify(dailyGoal)
);

}


/* ================= STATS ================= */

function updateStats(){

let total=

selectedFoods.reduce(

(total,food)=>({

cal:total.cal+food.calories,
pro:total.pro+food.protein,
carb:total.carb+food.carbs,
fat:total.fat+food.fat

}),

{
cal:0,
pro:0,
carb:0,
fat:0
}

);

$("calTotal").textContent=
`${total.cal.toFixed(0)} / ${dailyGoal.calories}`;

$("proTotal").textContent=
`${total.pro.toFixed(1)} / ${dailyGoal.protein}`;

$("carbTotal").textContent=
`${total.carb.toFixed(1)} / ${dailyGoal.carbs}`;

$("fatTotal").textContent=
`${total.fat.toFixed(1)} / ${dailyGoal.fat}`;

$("calBar").style.width=
Math.min(
100,
total.cal/dailyGoal.calories*100
)+"%";

$("proBar").style.width=
Math.min(
100,
total.pro/dailyGoal.protein*100
)+"%";

$("carbBar").style.width=
Math.min(
100,
total.carb/dailyGoal.carbs*100
)+"%";

$("fatBar").style.width=
Math.min(
100,
total.fat/dailyGoal.fat*100
)+"%";

}


/* ================= SEARCH ================= */

$("search").addEventListener(
"input",
function(){

let query=
this.value
.trim()
.toLowerCase();

if(!query){

renderFoods(foods);

return;

}

renderFoods(

foods.filter(food=>
food.name
.toLowerCase()
.includes(query)
)

);

});


/* ================= GOAL ================= */

function openGoal(){

$("weight").value=
localStorage.getItem("saykoWeight")||"";

$("height").value=
localStorage.getItem("saykoHeight")||"";

$("age").value=
localStorage.getItem("saykoAge")||"";

$("goalModal").style.display="flex";

}


function closeGoal(){

$("goalModal").style.display="none";

}


function setGoalType(button){

goalType=
button.dataset.goal;

document
.querySelectorAll(".goalOption")
.forEach(button=>
button.classList.remove("active")
);

button.classList.add("active");

}


/* ================= CALCULATE ================= */

function calculateGoal(){

let weight=
parseFloat($("weight").value);

let height=
parseFloat($("height").value);

let age=
parseFloat($("age").value);

let gender=
$("gender").value;

let activity=
parseFloat($("activity").value);

if(!weight||!height||!age){

alert("اكتب الوزن والطول والعمر");

return;

}

let bmr;

if(gender==="male"){

bmr=
10*weight+
6.25*height-
5*age+
5;

}else{

bmr=
10*weight+
6.25*height-
5*age-
161;

}

let calories=
bmr*activity;

if(goalType==="lose"){

calories-=250;

}

if(goalType==="gain"){

calories+=250;

}

let protein=
weight*1.8;

let fat=
weight*.8;

let carbs=
Math.max(
0,
(calories-
protein*4-
fat*9)/4
);

dailyGoal={

calories:
Math.round(calories),

protein:
Math.round(protein),

carbs:
Math.round(carbs),

fat:
Math.round(fat)

};

localStorage.setItem(
"saykoWeight",
weight
);

localStorage.setItem(
"saykoHeight",
height
);

localStorage.setItem(
"saykoAge",
age
);

saveData();

updateStats();

closeGoal();

}


/* ================= INITIAL ================= */

renderFoods();

renderSelected();

updateStats();


/* ================= PWA ================= */

let deferredInstallPrompt=null;

const installButton=
$("installButton");

window.addEventListener(
"beforeinstallprompt",
function(event){

event.preventDefault();

deferredInstallPrompt=event;

installButton.style.display="block";

});

installButton.addEventListener(
"click",
async function(){

if(!deferredInstallPrompt){
return;
}

deferredInstallPrompt.prompt();

await deferredInstallPrompt.userChoice;

deferredInstallPrompt=null;

installButton.style.display="none";

});

window.addEventListener(
"appinstalled",
function(){

installButton.style.display="none";

});

})
.catch(function(error){
