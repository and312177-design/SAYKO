<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SAYKØ FITNESS</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Tahoma,sans-serif;
}

body{
    background:#080808;
    color:#fff;
    min-height:100vh;
}

/* ================= HEADER ================= */

header{
    position:relative;
    background:#080808;
    border-bottom:1px solid #222;
    padding:18px 15px;
    text-align:center;
}

.logo{
    font-size:28px;
    font-weight:bold;
}

.logo span{
    color:#e50914;
}

.subtitle{
    color:#777;
    font-size:12px;
    margin-top:4px;
}

/* ================= HEADER BUTTONS ================= */

.headerButtons{
    position:absolute;
    top:18px;
    right:15px;

    display:flex;
    gap:7px;
    align-items:center;

    direction:rtl;
    z-index:2100;
}

.menuButton,
.bellButton{
    position:relative;

    width:43px;
    height:43px;

    background:#151515;
    border:1px solid #292929;
    border-radius:10px;

    color:#fff;
    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;
}

/* hamburger */

.menuButton{
    font-size:24px;
}

/* REAL BELL */

.bellIcon{
    width:22px;
    height:22px;

    fill:none;
    stroke:currentColor;

    stroke-width:1.8;
    stroke-linecap:round;
    stroke-linejoin:round;
}

/* red update dot */

.updateDot{
    position:absolute;

    top:5px;
    right:5px;

    width:9px;
    height:9px;

    background:#e50914;

    border-radius:50%;

    border:2px solid #151515;

    display:none;
}

.bellButton.hasUpdate .updateDot{
    display:block;
}

/* ================= SIDE MENU ================= */

.menuOverlay{
    position:fixed;
    inset:0;

    background:rgba(0,0,0,.65);

    display:none;

    z-index:1900;
}

.sideMenu{
    position:fixed;

    top:0;
    right:-290px;

    width:280px;
    height:100vh;

    background:#111;

    border-left:1px solid #303030;

    padding:25px 15px;

    transition:.25s ease;

    z-index:2000;

    box-shadow:-10px 0 30px rgba(0,0,0,.35);
}

.sideMenu.open{
    right:0;
}

.menuTitle{
    font-size:22px;
    font-weight:bold;
    margin-bottom:25px;
}

.menuItem{
    width:100%;

    background:#151515;
    color:#fff;

    border:1px solid #292929;

    padding:14px;

    border-radius:10px;

    margin-bottom:10px;

    cursor:pointer;

    text-align:right;

    font-size:16px;
}

/* ================= UPDATE DOT TEST ================= */

.testUpdate{
    margin:30px auto;
    width:90%;
    max-width:400px;
    padding:15px;

    background:#111;
    border:1px solid #292929;

    border-radius:12px;
}

.testUpdate button{
    margin-top:10px;

    padding:10px 15px;

    border:0;
    border-radius:8px;

    background:#e50914;
    color:#fff;

    cursor:pointer;
}

</style>

</head>

<body>

<header>

    <!-- الأزرار -->
    <div class="headerButtons">

        <!-- زر القائمة -->
        <button
            class="menuButton"
            onclick="openMenu()"
            aria-label="القائمة">
            ☰
        </button>

        <!-- زر الجرس الحقيقي -->
        <button
            id="bellButton"
            class="bellButton"
            onclick="openUpdateNotification()"
            aria-label="التحديثات">

            <svg
                viewBox="0 0 24 24"
                class="bellIcon">

                <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>

                <path d="M10 21h4"></path>

            </svg>

            <span class="updateDot"></span>

        </button>

    </div>

    <div class="logo">
        SAYKØ <span>FITNESS</span>
    </div>

    <div class="subtitle">
        Nutrition • Calories • Progress
    </div>

</header>


<!-- ================= SIDE MENU ================= -->

<div
    id="menuOverlay"
    class="menuOverlay"
    onclick="closeMenu()">
</div>

<div
    id="sideMenu"
    class="sideMenu">

    <div class="menuTitle">
        SAYKØ FITNESS
    </div>

    <button
        class="menuItem"
        onclick="openReferences()">
        📚 المراجع
    </button>

    <button
        class="menuItem"
        onclick="openThemeMenu()">
        🎨 المظهر
    </button>

</div>


<!-- ================= TEST AREA ================= -->

<div class="testUpdate">

    <strong>
        SAYKØ FITNESS
    </strong>

    <p style="margin-top:8px;color:#777;">
        اضغط لتجربة ظهور نقطة التحديث على الجرس
    </p>

    <button onclick="testUpdate()">
        تجربة التحديث
    </button>

</div>


<script>

/* ================= MENU ================= */

function openMenu(){

    document.getElementById("sideMenu")
        .classList.add("open");

    document.getElementById("menuOverlay")
        .style.display="block";

}


function closeMenu(){

    document.getElementById("sideMenu")
        .classList.remove("open");

    document.getElementById("menuOverlay")
        .style.display="none";

}


/* ================= UPDATE ================= */

let updateAvailable=false;


function showUpdateIndicator(){

    updateAvailable=true;

    document
        .getElementById("bellButton")
        .classList.add("hasUpdate");

}


function clearUpdateIndicator(){

    updateAvailable=false;

    document
        .getElementById("bellButton")
        .classList.remove("hasUpdate");

}


function openUpdateNotification(){

    if(updateAvailable){

        alert(
            "🔔 تحديث جديد\n\n" +
            "يوجد إصدار جديد من SAYKØ FITNESS."
        );

    }else{

        alert(
            "SAYKØ FITNESS\n\n" +
            "أنت تستخدم أحدث إصدار من البرنامج."
        );

    }

}


/* ================= TEST ================= */

function testUpdate(){

    showUpdateIndicator();

}


/* ================= PLACEHOLDERS ================= */

function openReferences(){

    closeMenu();

    alert(
        "📚 المراجع\n\n" +
        "سيتم إضافة المراجع هنا."
    );

}


function openThemeMenu(){

    closeMenu();

    alert(
        "🎨 المظهر\n\n" +
        "سيتم فتح إعدادات المظهر هنا."
    );

}

</script>

</body>
</html>
