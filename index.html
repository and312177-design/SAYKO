<title>SAYKØ FITNESS</title>

<link rel="icon"
type="image/jpeg"
href="1790471069347.jpg">

<link rel="manifest"
href="manifest.json">

<meta name="theme-color"
content="#e50914">

<meta name="mobile-web-app-capable"
content="yes">

<meta name="apple-mobile-web-app-capable"

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Tahoma,sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#080808;
    color:#fff;
    min-height:100vh;
}

/* HEADER */

header{
    background:#080808;
    border-bottom:1px solid #222;
    padding:22px 15px 18px;
    text-align:center;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:28px;
    font-weight:900;
    letter-spacing:1px;
}

.logo span{
    color:#e50914;
}

.subtitle{
    color:#888;
    font-size:12px;
    margin-top:5px;
}

#installButton{
    display:none;
    margin:14px auto 0;
    border:1px solid #e50914;
    background:#e50914;
    color:#fff;
    padding:10px 18px;
    border-radius:10px;
    font-size:13px;
    font-weight:bold;
    cursor:pointer;
}

/* CONTAINER */

.container{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:18px 14px 40px;
}

/* SEARCH */

.search{
    width:100%;
    background:#111;
    border:1px solid #292929;
    color:#fff;
    padding:15px;
    border-radius:14px;
    outline:none;
    font-size:15px;
    margin-bottom:16px;
}

.search:focus{
    border-color:#e50914;
}

.search::placeholder{
    color:#777;
}

/* GOAL */

.goal{
    background:linear-gradient(145deg,#151515,#0d0d0d);
    border:1px solid #262626;
    border-radius:16px;
    padding:16px;
    margin-bottom:22px;
    box-shadow:none;
}

.goalHead{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:16px;
}

.goalHead b{
    font-size:17px;
}

.goalHead button{
    background:#e50914;
    color:#fff;
    border:0;
    padding:8px 15px;
    border-radius:9px;
    font-weight:bold;
    cursor:pointer;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.stat{
    background:#151515;
    border:1px solid #252525;
    border-radius:12px;
    padding:12px 9px;
}

.stat b{
    display:block;
    font-size:13px;
    margin-bottom:5px;
}

.stat small{
    color:#888;
    font-size:11px;
}

.progress{
    width:100%;
    height:7px;
    background:#222;
    border-radius:20px;
    overflow:hidden;
    margin-top:9px;
}

.progress i{
    display:block;
    width:0%;
    height:100%;
    background:#e50914;
    border-radius:20px;
    transition:.3s;
}

/* TITLES */

.sectionTitle{
    font-size:18px;
    margin:24px 0 12px;
    border-right:3px solid #e50914;
    padding-right:9px;
}

/* FOOD GRID */

.foodGrid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:9px;
}

.food{
    background:#111;
    border:1px solid #252525;
    border-radius:12px;
    padding:12px 8px;
    min-height:75px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    cursor:pointer;
    transition:.2s;
}

.food:hover{
    border-color:#e50914;
    transform:translateY(-2px);
}

.food:active{
    transform:scale(.97);
    border-color:#e50914;
}

.food b{
    font-size:13px;
    line-height:1.5;
}

.food small{
    color:#888;
    font-size:10px;
    margin-top:4px;
}

/* SELECTED */

.selected{
    display:flex;
    flex-direction:column;
    gap:9px;
}

.empty{
    background:#101010;
    border:1px dashed #303030;
    color:#666;
    padding:25px;
    border-radius:13px;
    text-align:center;
    font-size:14px;
}

.foodRow{
    background:#151515;
    border:1px solid #252525;
    border-radius:10px;
    padding:13px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.foodInfo{
    min-width:0;
}

.foodInfo b{
    display:block;
    font-size:14px;
    margin-bottom:5px;
}

.foodInfo small{
    color:#888;
    font-size:10px;
    line-height:1.8;
}

.deleteBtn{
    flex-shrink:0;
    background:#25090b;
    color:#e50914;
    border:0;
    padding:8px 11px;
    border-radius:8px;
    cursor:pointer;
    font-size:11px;
}

.clearBtn{
    width:100%;
    margin-top:13px;
    background:#222;
    color:#fff;
    border:1px solid #333;
    padding:12px;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

/* FOOTER */

footer{
    text-align:center;
    color:#444;
    border-top:1px solid #191919;
    padding:22px;
    font-size:12px;
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.88);
    backdrop-filter:blur(5px);
    z-index:500;
    align-items:center;
    justify-content:center;
    padding:15px;
}

.modalBox{
    width:100%;
    max-width:430px;
    max-height:90vh;
    overflow-y:auto;
    background:#0d0d0d;
    border:1px solid #292929;
    border-top:3px solid #e50914;
    border-radius:18px;
    padding:20px;
    box-shadow:0 20px 70px rgba(0,0,0,.8);
}

.modalBox h2{
    font-size:20px;
    margin-bottom:18px;
    text-align:center;
}

/* UNITS */

.units{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
    margin-bottom:13px;
}

.unitBtn{
    background:#111;
    border:1px solid #292929;
    color:#aaa;
    padding:10px 5px;
    border-radius:9px;
    cursor:pointer;
    font-size:12px;
}

.unitBtn.active{
    background:#e50914;
    border-color:#e50914;
    color:#fff;
    font-weight:bold;
}

/* INPUTS */

.modalBox input,
.modalBox select{
    width:100%;
    background:#080808;
    border:1px solid #292929;
    color:#fff;
    padding:13px;
    border-radius:10px;
    outline:none;
    margin-bottom:10px;
    font-size:14px;
}

.modalBox input:focus,
.modalBox select:focus{
    border-color:#e50914;
}

.modalBox select option{
    background:#111;
    color:#fff;
}

.hint{
    color:#888;
    font-size:11px;
    margin:4px 0 12px;
    text-align:center;
}

.preview{
    background:#151515;
    border:1px solid #222;
    border-radius:10px;
    padding:14px;
    line-height:2;
    color:#888;
    font-size:13px;
    margin-bottom:15px;
}

.preview b{
    color:#fff;
}

/* ACTIONS */

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:12px;
}

.addBtn,
.closeBtn{
    border:0;
    padding:12px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    font-size:14px;
}

.addBtn{
    background:#e50914;
    color:#fff;
}

.closeBtn{
    background:#202020;
    color:#fff;
    border:1px solid #333;
}

/* GOAL OPTIONS */

.goalOptions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:4px;
}

.goalOption{
    background:#101010;
    color:#888;
    border:1px solid #292929;
    padding:11px 7px;
    border-radius:10px;
    cursor:pointer;
    font-size:11px;
    line-height:1.5;
}

.goalOption.active{
    background:#19090b;
    border-color:#e50914;
    color:#fff;
}

/* MOBILE */

@media(max-width:650px){

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .foodGrid{
        grid-template-columns:repeat(3,1fr);
    }

}

@media(max-width:350px){

    .foodGrid{
        grid-template-columns:repeat(2,1fr);
    }

    .logo{
        font-size:25px;
    }

    .container{
        padding-left:10px;
        padding-right:10px;
    }

}

</style>

</head>

SAYKØ FITNESS

<div

قطعة

</div>

<div
id="quantityHint"

<div
id="preview"
class="preview">

<div class="actions">

<button
class="addBtn"

<button
class="closeBtn"

إلغاء

</button>

</div>

</div>

</div>


<!-- GOAL MODAL -->

<div
id="goalModal"
class="modal">

<input
id="weight"
type="number"
placeholder="الوزن بالكجم">


<input
id="height"
type="number"
placeholder="الطول بالسنتيمتر">


<input
id="age"
type="number"
placeholder="العمر">


<select id="gender">

<option value="male">
ذكر
</option>

<option value="female">
أنثى
</option>

</select>


<select id="activity">

<option value="1.2">
قليل الحركة
</option>

<option value="1.375">
نشاط خفيف
</option>

<option value="1.55"
selected>
نشاط متوسط
</option>

<option value="1.725">
نشاط عالي
</option>

</select>


<div class="goalOptions">

<button
class="goalOption active"
data-goal="build"
onclick="setGoalType(this)">

ضبط الدهون وبناء العضلات

</button>


<button
class="goalOption"
data-goal="maintain"
onclick="setGoalType(this)">

تثبيت الوزن

</button>


<button
class="goalOption"
data-goal="lose"
onclick="setGoalType(this)">

خسارة وزن تدريجية

</button>


<button
class="goalOption"
data-goal="gain"
onclick="setGoalType(this)">

زيادة الوزن

</button>

</div>


<div class="actions">

<button
class="addBtn"
onclick="calculateGoal()">

حفظ

</button>


<button
class="closeBtn"
onclick="closeGoal()">

إلغاء

</button>

</div>

</div>

</div>

/* =========================
SPOON WEIGHT
========================= */

function getSpoonWeight(food){

    return spoonWeights[food.name] || 10;

}


/* =========================
RENDER FOODS
========================= */

function renderFoods(list=foods){

    $("foodGrid").innerHTML=

    list.map(food=>`

        <div
        class="food"
        onclick="openFood(${foods.indexOf(food)})">

            <b>
                ${food.name}
            </b>

            <small>
                ${food.calories} kcal / 100g
            </small>

        </div>

    `).join("");

}


/* =========================
OPEN FOOD
========================= */

function openFood(index){

    selectedFood=foods[index];

    $("foodTitle").textContent=
    selectedFood.name;


    if(selectedFood.weight){

        selectedUnit="piece";

        $("pieceBtn").style.display="block";

        $("gramsBtn").style.display="none";

        $("spoonBtn").style.display="none";

    }else{

        selectedUnit="grams";

        $("pieceBtn").style.display="none";

        $("gramsBtn").style.display="block";

        $("spoonBtn").style.display="block";

    }


    $("quantity").value=
    selectedUnit==="piece"
    ? 1
    : 100;


    selectUnit(selectedUnit);

    updatePreview();


    $("foodModal").style.display="flex";

}


/* =========================
SELECT UNIT
========================= */

function selectUnit(unit){

    selectedUnit=unit;


    $("gramsBtn")
    .classList
    .toggle(
        "active",
        unit==="grams"
    );


    $("spoonBtn")
    .classList
    .toggle(
        "active",
        unit==="spoon"
    );


    $("pieceBtn")
    .classList
    .toggle(
        "active",
        unit==="piece"
    );


    $("quantity").value=
    unit==="piece"
    ? 1
    : 100;


    updatePreview();

}


/* =========================
UPDATE PREVIEW
========================= */

function updatePreview(){

    if(!selectedFood)return;


    let q=
    parseFloat(
        $("quantity").value
    ) || 0;


    let grams=q;

    let label="جم";


    if(selectedUnit==="spoon"){

        grams=
        q*
        getSpoonWeight(
            selectedFood
        );

        label="معلقة";

    }


    if(selectedUnit==="piece"){

        grams=
        q*
        (selectedFood.weight||100);

        label="قطعة";

    }


    if(selectedUnit==="spoon"){

        $("quantityHint").textContent=
        `المعلقة الكبيرة من ${selectedFood.name} ≈ ${getSpoonWeight(selectedFood)} جم`;

    }else if(selectedUnit==="piece"){

        $("quantityHint").textContent=
        `القطعة ≈ ${selectedFood.weight} جم`;

    }else{

        $("quantityHint").textContent=
        "القيمة محسوبة حسب الوزن بالجرام";

    }


    let factor=
    grams/100;


    $("preview").innerHTML=`

        الكمية:
        <b>${q} ${label}</b>
        ≈
        <b>${grams.toFixed(1)} جم</b>

        <br>

        السعرات:
        <b>
        ${(selectedFood.calories*factor).toFixed(0)}
        </b>
        kcal

        <br>

        البروتين:
        <b>
        ${(selectedFood.protein*factor).toFixed(1)}g
        </b>

        &nbsp; | &nbsp;

        الكارب:
        <b>
        ${(selectedFood.carbs*factor).toFixed(1)}g
        </b>

        &nbsp; | &nbsp;

        الدهون:
        <b>
        ${(selectedFood.fat*factor).toFixed(1)}g
        </b>

    `;

}


/* =========================
CONFIRM FOOD
========================= */

function confirmFood(){

    if(!selectedFood)return;


    let q=
    parseFloat(
        $("quantity").value
    ) || 0;


    if(q<=0)return;


    let grams;


    if(selectedUnit==="spoon"){

        grams=
        q*
        getSpoonWeight(
            selectedFood
        );

    }else if(selectedUnit==="piece"){

        grams=
        q*
        (selectedFood.weight||100);

    }else{

        grams=q;

    }


    let factor=
    grams/100;


    selectedFoods.push({

        name:selectedFood.name,

        grams:grams,

        calories:
        selectedFood.calories*
        factor,

        protein:
        selectedFood.protein*
        factor,

        carbs:
        selectedFood.carbs*
        factor,

        fat:
        selectedFood.fat*
        factor,

        display:
        `${q} ${
            selectedUnit==="spoon"
            ? "معلقة"
            : selectedUnit==="piece"
            ? "قطعة"
            : "جم"
        }`

    });


    saveData();

    closeFood();

    renderSelected();

}


/* =========================
CLOSE FOOD
========================= */

function closeFood(){

    $("foodModal")
    .style
    .display="none";

}


/* =========================
RENDER SELECTED
========================= */

function renderSelected(){

    if(!selectedFoods.length){

        $("selected").innerHTML=`

            <div class="empty">
                لم تضف أي طعام بعد
            </div>

        `;

        updateStats();

        return;

    }


    $("selected").innerHTML=

    selectedFoods.map(
    (food,index)=>`

        <div class="foodRow">

            <div class="foodInfo">

                <b>
                    ${food.name}
                </b>

                <small>

                    ${food.display}

                    ≈

========================= */

function removeFood(index){

    selectedFoods.splice(
        index,

    renderSelected();

========================= */

function clearAll(){

    selectedFoods=[];

    renderSelected();

/* =========================
SAVE DATA
========================= */

function saveData(){

    localStorage.setItem(
        "novarSelectedFoods",
        JSON.stringify(selectedFoods)
    );


    localStorage.setItem(
        "novarDailyGoals",
        JSON.stringify(dailyGoal)
    );

/* =========================
UPDATE STATS
========================= */

function updateStats(){

    let total=
    selectedFoods.reduce(

        (total,food)=>({

            cal:
            total.cal+
            food.calories,

            pro:
            total.pro+
            food.protein,

            carb:
            total.carb+
            food.carbs,

            fat:
            total.fat+
            food.fat

        }),

        {
            cal:0,
            pro:0,
            carb:0,
            fat:0
        }

    );


    $("calTotal").textContent=
    `${total.cal.toFixed(0)} / ${dailyGoal.calories}`;


    $("proTotal").textContent=
    `${total.pro.toFixed(1)} / ${dailyGoal.protein}`;


    $("carbTotal").textContent=
    `${total.carb.toFixed(1)} / ${dailyGoal.carbs}`;


    $("fatTotal").textContent=
    `${total.fat.toFixed(1)} / ${dailyGoal.fat}`;


    $("calBar").style.width=

    Math.min(
        100,
        dailyGoal.calories
        ?
        total.cal/
        dailyGoal.calories*
        100
        :
        0
    )+"%";


    $("proBar").style.width=

    Math.min(
        100,
        dailyGoal.protein
        ?
        total.pro/
        dailyGoal.protein*
        100
        :
        0
    )+"%";


    $("carbBar").style.width=

    Math.min(
        100,
        dailyGoal.carbs
        ?
        total.carb/
        dailyGoal.carbs*
        100
        :
        0
    )+"%";


    $("fatBar").style.width=

    Math.min(
        100,
        dailyGoal.fat
        ?
        total.fat/
        dailyGoal.fat*
        100
        :
        0
    )+"%";

}

/* =========================
CALCULATE GOAL
========================= */

function calculateGoal(){

    let weight=
    parseFloat(
        $("weight").value
    );


    let height=
    parseFloat(
        $("height").value
    );


    let age=
    parseFloat(
        $("age").value
    );


    let gender=
    $("gender").value;


    let activity=
    parseFloat(
        $("activity").value
    );


    if(!weight || !height || !age){

        alert(
            "اكتب الوزن والطول والعمر"
        );

        return;

    }


    let bmr;


    if(gender==="male"){

        bmr=
        10*weight+
        6.25*height-
        5*age+
        5;

    }else{

        bmr=
        10*weight+
        6.25*height-
        5*age-
        161;

    }


    let calories=
    bmr*
    activity;


    if(goalType==="lose"){

        calories-=250;

    }


    if(goalType==="gain"){

        calories+=250;

    }


    let protein=
    weight*1.8;


    let fat=
    weight*.8;


    let carbs=
    Math.max(
        0,
        (
            calories-
            protein*4-
            fat*9
        )/4
    );


    dailyGoal={

        calories:
        Math.round(calories),

        protein:
        Math.round(protein),

        carbs:
        Math.round(carbs),

        fat:
        Math.round(fat)

    };


    localStorage.setItem(
        "saykoWeight",
        weight
    );


    localStorage.setItem(
        "saykoHeight",
        height
    );


    localStorage.setItem(
        "saykoAge",
        age
    );


    saveData();

    updateStats();

    closeGoal();

}
